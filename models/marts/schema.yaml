version: 2

models:
  - name: dim_customers
    description: "Customer dimension table"

    columns:
      - name: customer_id
        description: "Unique customer identifier"
        data_tests:
          - unique
          - not_null

      - name: market_segment
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - BUILDING
                  - AUTOMOBILE
                  - MACHINERY
                  - HOUSEHOLD
                  - FURNITURE